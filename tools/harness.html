<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trick Shot: local lobby harness</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: calc(50vh - 2px); gap: 4px; height: 100vh; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<!-- TEST ONLY. Serve the project folder (node tools\serve.cjs 8197) and open
     http://127.0.0.1:8197/tools/harness.html?n=2  (n = 1..4 players; &auto = they play by themselves;
     &drive = this page steps the games, for headless browsers; &big=B fills the page with player B's screen).
     Frame i is player A, B, C or D (A hosts). From the console: frame(0).SB.Game.sim, fkLeave("B"). -->
<div class="frames" id="frames"></div>
<script>
const q = new URLSearchParams(location.search);
const n = Math.max(1, Math.min(4, +(q.get("n") || 2)));
const ids = ["A", "B", "C", "D"].slice(0, n);
const opts = JSON.stringify({ letters: q.get("letters") || "3", air: q.get("air") || "air", rival: q.get("rival") || "1" });
for (const id of ids) {
  const f = document.createElement("iframe");
  f.src = "/Work/index.html?fake=" + id + "&lobby=" + ids.join(",") + "&opts=" + encodeURIComponent(opts) + "&nolock=1&desktop=1" + (q.has("auto") ? "&auto=1" : "") + "&g=" + (q.get("g") || "low");
  f.id = "f" + id;
  if (q.get("big")) { f.style.cssText = q.get("big") === id ? "position:fixed;inset:0;width:100%;height:100%;z-index:1" : "position:fixed;right:0;bottom:0;width:160px;height:90px;z-index:2"; }
  document.getElementById("frames").appendChild(f);
}
window.frame = (i) => document.querySelectorAll("iframe")[i].contentWindow;
// &drive: step every game from here (headless browsers barely run requestAnimationFrame in iframes)
if (q.has("drive")) setInterval(() => {
  document.querySelectorAll("iframe").forEach((f) => { const w = f.contentWindow; if (w && w.SB && w.SB.Game && w.SB.Game.sim) { try { w.SB.Game.step(+(q.get("steps") || 3), 1 / 20, q.has("nodraw")); } catch (e) { console.error(f.id + " " + (e.stack || e)); } } });
}, 50);
window.fkLeave = (id) => { const f = document.getElementById("f" + id); if (f) f.remove(); const any = document.querySelector("iframe"); if (any) any.contentWindow.fkLeave(id); };
</script>
</body>
</html>
